<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            font-family: sans-serif;
        }
        
        input {
            padding: 10px;
            font-size: 18px;
            margin: 10px 0;
        }
        
        #result {
            margin-top: 10px;
            font-size: 18px;
            color: #333;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }
        
        thead th {
            background-color: #F5EEDD;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        #searchInput {
            margin-bottom: 10px;
            padding: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h1>Employee Reports</h1>
    <input type="text" id="searchInput" placeholder="Search by Employee ID" onkeyup="searchTable()" />
    <button type="submit">Submit</button>

    <table>
        <thead>
            <tr>
                <th>Employee ID</th>
                <th>Employee Name</th>
                <th>Department</th>
                <th>Date</th>
                <th>Time In</th>
                <th>Time Out</th>
                <th>Minutes Late</th>
                <th>No. of days Present</th>
                <th>No. of days Absent</th>
            </tr>
        </thead>
        <tbody id="attendanceTable">
            <!-- Results will be loaded here -->
        </tbody>
    </table>

    <script>
        function searchTable() {
            function searchTable() {
                const input = document.getElementById("searchInput").value;

                fetch("search.php?query=" + encodeURIComponent(input))
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById("attendanceTable").innerHTML = data;
                    });
            }

        }
    </script>
</body>

</html>
