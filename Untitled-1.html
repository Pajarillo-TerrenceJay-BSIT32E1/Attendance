<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

        thead th {
            background-color: #F5EEDD;
            text-align: left;
            padding: 10px;
        }

        tbody td {
            padding: 10px;
            border-bottom: 1px solid black;
        }

        #searchInput {
            margin-bottom: 10px;
            padding: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <input type="text" id="searchInput" placeholder="Search by Employee ID" onkeyup="debouncedSearch()" />

    <table>
        <thead>
            <tr>
                <th>Employee ID</th>
                <th>Employee Name</th>
                <th>Department</th>
                <th>Date</th>
                <th>Time In</th>
                <th>Time Out</th>
            </tr>
        </thead>
        <tbody id="attendanceTable">
            <!-- Example data rows here -->
            <tr>
                <td>EMP001</td>
                <td>Ginmer Estrella</td>
                <td>HR</td>
                <td>2025-04-28</td>
                <td>08:00 AM</td>
                <td>05:00 PM</td>
            </tr>
            <tr>
                <td>EMP002</td>
                <td>kulot rodrin</td>
                <td>IT</td>
                <td>2025-04-28</td>
                <td>09:00 AM</td>
                <td>06:00 PM</td>

            </tr>
        </tbody>
    </table>

    <script>
        function loadAttendanceByEmployeeId(employeeId) {
            const rows = document.querySelectorAll("#attendanceTable tr");
            rows.forEach(row => {
                const idCell = row.querySelector("td:first-child");
                if (idCell) {
                    if (idCell.textContent.toLowerCase().includes(employeeId.toLowerCase())) {
                        row.style.display = "";
                    } else {
                        row.style.display = "none";
                    }
                }
            });
        }

        let debounceTimer;
        function debouncedSearch() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(function () {
                const input = document.getElementById("searchInput").value;
                loadAttendanceByEmployeeId(input);
            }, 300);
        }

        // Optional: Auto-load all records when page loads
        window.onload = function () {
            loadAttendanceByEmployeeId('');
        };
    </script>
</body>

</html>
